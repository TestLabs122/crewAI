[project]
name = "vulnerable-test-app"
version = "0.1.0"
description = "Intentionally vulnerable application for SCA testing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Security Test", email = "test@example.com"}
]
dependencies = [
    "django==2.2.0",
    "flask==0.12.2",
    "requests==2.6.0",
    "urllib3==1.24.1",
    "pyyaml==5.3.1",
    "jinja2==2.10",
    "werkzeug==0.14.1",
    "pillow==6.2.0",
    "cryptography==2.3",
    "paramiko==2.4.0",
    "sqlalchemy==1.3.0",
    "lxml==4.6.2",
    "numpy==1.16.0",
    "scipy==1.4.1",
    "ansible==2.7.0",
    "markupsafe==1.0",
    "pytz==2020.1",
    "sqlparse==0.3.0",
    "psutil==5.6.6",
    "httplib2==0.18.0",
    "bleach==3.1.0",
    "notebook==5.7.8",
    "twisted==19.7.0",
    "tornado==5.1.1",
    "aiohttp==3.6.0",
    "redis==3.3.0",
    "pymongo==3.9.0",
    "celery==4.3.0",
    "kombu==4.6.5",
    "pycryptodome==3.6.0",
    "defusedxml==0.6.0",
    "py==1.8.0",
    "setuptools==40.0.0",
    "pip==19.0.0",
    "nltk==3.4.5",
    "tensorflow==2.3.0",
    "keras==2.3.1",
    "opencv-python==4.1.2.30",
    "beautifulsoup4==4.8.0",
    "scrapy==1.8.0",
    "selenium==3.141.0",
    "click==7.0",
    "pycrypto==2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==5.3.0",
    "coverage==4.5.4",
    "tox==3.14.0",
]

[build-system]
requires = ["setuptools>=40.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "black==19.10b0",
    "flake8==3.7.9",
    "mypy==0.750",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
